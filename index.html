<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>タコネーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=ab9ff2b9">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="brand" id="brand"></span>
      <span class="qcount" id="qcount"></span>
    </header>

    <section class="stage">
      <svg class="maestro" id="maestro" data-mood="idle" viewBox="0 0 160 170" aria-hidden="true">
        <!-- 後ろの足（左右に広がる） -->
        <g class="legs">
          <!-- 横の足 -->
          <path d="M40 120 Q22 130 12 123 M52 128 Q40 144 26 141 M108 128 Q120 144 134 141" class="leg-edge"/>
          <path d="M40 120 Q22 130 12 123 M52 128 Q40 144 26 141 M108 128 Q120 144 134 141" class="leg"/>
          <!-- 前の足（体の下からちょこんと） -->
          <path d="M68 126 Q64 144 54 150 M92 126 Q96 144 106 150" class="leg-edge"/>
          <path d="M68 126 Q64 144 54 150 M92 126 Q96 144 106 150" class="leg"/>
          <ellipse cx="13" cy="121" rx="6" ry="7.5" class="tip" transform="rotate(-30 13 121)"/>
          <ellipse cx="25" cy="140" rx="6" ry="7.5" class="tip" transform="rotate(-60 25 140)"/>
          <ellipse cx="135" cy="140" rx="6" ry="7.5" class="tip" transform="rotate(60 135 140)"/>
          <ellipse cx="54" cy="149" rx="7.5" ry="6" class="tip" transform="rotate(-20 54 149)"/>
          <ellipse cx="106" cy="149" rx="7.5" ry="6" class="tip" transform="rotate(20 106 149)"/>
        </g>
        <!-- 指揮棒を持つ右の足 -->
        <g class="arm">
          <path d="M124 106 Q142 104 147 88" class="leg-edge"/>
          <path d="M124 106 Q142 104 147 88" class="leg"/>
          <line x1="149" y1="84" x2="157" y2="46" class="baton" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="147" cy="86" rx="6" ry="7.5" class="tip" transform="rotate(20 147 86)"/>
        </g>
        <!-- 体（ぬいぐるみのような平たい丸） -->
        <path d="M22 96 C22 56 48 36 80 36 C112 36 138 56 138 96 C138 124 114 136 80 136 C46 136 22 124 22 96 Z" class="tako"/>
        <ellipse cx="44" cy="106" rx="8" ry="5" class="cheek"/>
        <ellipse cx="116" cy="106" rx="8" ry="5" class="cheek"/>
        <!-- 蝶ネクタイ -->
        <path d="M69 124 L80 129 L69 134 Z M91 124 L80 129 L91 134 Z" class="tie"/>
        <circle cx="80" cy="129" r="3.2" class="tie"/>
        <!-- 筒の口 -->
        <ellipse cx="80" cy="105" rx="15" ry="14" class="mouth-outer"/>
        <ellipse cx="80" cy="106" rx="8.5" ry="8" class="mouth-inner"/>

        <!-- 表情 -->
        <g class="face face-idle">
          <circle cx="54" cy="90" r="4.6" class="ink"/><circle cx="106" cy="90" r="4.6" class="ink"/>
        </g>
        <g class="face face-think">
          <path d="M44 79 Q50 75 59 77 M101 77 Q110 75 116 79" class="line" fill="none" stroke-width="2.8" stroke-linecap="round"/>
          <circle cx="52" cy="88" r="4.6" class="ink"/><circle cx="104" cy="88" r="4.6" class="ink"/>
        </g>
        <g class="face face-idea">
          <circle cx="54" cy="89" r="6" class="ink"/><circle cx="106" cy="89" r="6" class="ink"/>
          <ellipse cx="80" cy="106" rx="10.5" ry="10" class="mouth-inner"/>
          <g class="spark"><path d="M22 30 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 Z"/><path d="M134 26 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/></g>
        </g>
        <g class="face face-proud">
          <path d="M46 92 Q54 82 62 92 M98 92 Q106 82 114 92" class="line" fill="none" stroke-width="3.4" stroke-linecap="round"/>
        </g>
        <g class="face face-sad">
          <path d="M47 84 L58 90 L47 96 M113 84 L102 90 L113 96" class="line" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M128 60 q6 9 0 14 q-6 -5 0 -14 Z" class="sweat"/>
        </g>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <section class="panel" id="panel"></section>
  </main>

  <template id="tpl-title">
    <p class="tagline" data-tagline></p>
    <button class="btn primary big" data-action="start">はじめる</button>
    <p class="fine" data-count></p>
  </template>

  <template id="tpl-question">
    <h1 class="question" data-question></h1>
    <div class="answers">
      <button class="btn ans yes" data-u="1">はい</button>
      <button class="btn ans no" data-u="0">いいえ</button>
      <button class="btn ans" data-u="null">わからない</button>
      <button class="btn ans" data-u="0.75">たぶんそう</button>
      <button class="btn ans" data-u="0.25">たぶん違う</button>
    </div>
    <div class="meter" title="確信度"><div class="meter-fill" data-meter></div></div>
    <button class="btn ghost" data-action="undo">← 1つ前の質問に戻る</button>
  </template>

  <template id="tpl-guess">
    <div class="card guess-card">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <div class="guess-sub" data-sub></div>
    </div>
    <div class="answers two">
      <button class="btn ans yes" data-action="correct">はい！</button>
      <button class="btn ans no" data-action="wrong">ちがう</button>
    </div>
  </template>

  <template id="tpl-profile">
    <div class="card profile">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <dl class="facts" data-facts></dl>
      <div class="episodes-wrap">
        <h2 class="episodes-title">エピソード</h2>
        <ul class="episodes" data-episodes></ul>
        <button class="btn ghost small" data-action="more" hidden>もっと見る</button>
      </div>
    </div>
    <button class="btn primary big" data-action="restart">もう一回あそぶ</button>
  </template>

  <template id="tpl-giveup">
    <input class="search" type="search" placeholder="あだ名で検索" data-search aria-label="あだ名で検索">
    <div class="roster" data-roster></div>
    <button class="btn ghost" data-action="restart">答えずにやり直す</button>
  </template>

  <script src="config.js?v=257f1e4b"></script>
  <script src="data/data.js?v=e8df3ba4"></script>
  <script src="engine.js?v=06d872c0"></script>
  <script src="app.js?v=452f1d6c"></script>
</body>
</html>
