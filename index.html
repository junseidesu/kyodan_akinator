<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ダンイネーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="brand" id="brand"></span>
      <span class="qcount" id="qcount"></span>
    </header>

    <section class="stage">
      <svg class="maestro" id="maestro" data-mood="idle" viewBox="0 0 160 170" aria-hidden="true">
        <!-- 足（タコの脚） -->
        <g class="legs">
          <path d="M52 92 C38 108 26 118 28 138 C30 150 22 156 14 152" class="leg"/>
          <path d="M60 98 C52 118 46 132 50 150 C52 160 46 166 38 164"  class="leg"/>
          <path d="M72 100 C70 122 68 140 74 156 C77 164 72 168 66 167" class="leg"/>
          <path d="M88 100 C90 122 92 140 86 156 C83 164 88 168 94 167" class="leg"/>
          <path d="M100 98 C108 118 114 132 110 150 C108 160 114 166 122 164" class="leg"/>
          <g class="suckers">
            <circle cx="30" cy="132" r="2.4"/><circle cx="27" cy="143" r="2.2"/>
            <circle cx="48" cy="140" r="2.4"/><circle cx="49" cy="151" r="2.2"/>
            <circle cx="70" cy="140" r="2.4"/><circle cx="72" cy="151" r="2.2"/>
            <circle cx="90" cy="140" r="2.4"/><circle cx="88" cy="151" r="2.2"/>
            <circle cx="112" cy="140" r="2.4"/><circle cx="111" cy="151" r="2.2"/>
          </g>
        </g>
        <!-- 指揮棒を持つ足 -->
        <g class="arm">
          <path d="M106 90 C122 92 130 90 136 84" class="leg"/>
          <circle cx="133" cy="88" r="2.2" class="sucker"/>
          <line x1="138" y1="81" x2="156" y2="44" class="baton" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- 頭 -->
        <path d="M36 62 C36 26 56 10 80 10 C104 10 124 26 124 62 C124 86 106 102 80 102 C54 102 36 86 36 62 Z" class="tako"/>
        <ellipse cx="62" cy="28" rx="7" ry="4.5" class="spot" transform="rotate(-25 62 28)"/>
        <circle cx="104" cy="34" r="3.5" class="spot"/>
        <circle cx="96" cy="22" r="2.2" class="spot"/>
        <ellipse cx="58" cy="80" rx="6.5" ry="3.8" class="cheek"/>
        <ellipse cx="102" cy="80" rx="6.5" ry="3.8" class="cheek"/>
        <!-- 蝶ネクタイ -->
        <path d="M68 100 L80 105 L68 110 Z M92 100 L80 105 L92 110 Z" class="tie"/>
        <circle cx="80" cy="105" r="3" class="tie"/>

        <!-- 表情 -->
        <g class="face face-idle">
          <path d="M62 56 L72 54 M88 54 L98 56" class="line" stroke-width="3" stroke-linecap="round"/>
          <circle cx="68" cy="66" r="3.4" class="ink"/><circle cx="92" cy="66" r="3.4" class="ink"/>
          <path d="M72 93 Q80 98 88 93" class="line" fill="none" stroke-width="2.6" stroke-linecap="round"/>
        </g>
        <g class="face face-think">
          <path d="M61 55 L72 51 M88 53 L99 55" class="line" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="63" r="3.4" class="ink"/><circle cx="94" cy="63" r="3.4" class="ink"/>
          <path d="M74 94 L86 93" class="line" fill="none" stroke-width="2.6" stroke-linecap="round"/>
        </g>
        <g class="face face-idea">
          <path d="M61 50 L72 48 M88 48 L99 50" class="line" stroke-width="3" stroke-linecap="round"/>
          <circle cx="68" cy="65" r="5" class="eye-white"/><circle cx="92" cy="65" r="5" class="eye-white"/>
          <circle cx="68" cy="65" r="2.8" class="ink"/><circle cx="92" cy="65" r="2.8" class="ink"/>
          <ellipse cx="80" cy="95" rx="5" ry="5.5" class="ink"/>
          <g class="spark"><path d="M22 30 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 Z"/></g>
        </g>
        <g class="face face-proud">
          <path d="M61 55 L72 53 M88 53 L99 55" class="line" stroke-width="3" stroke-linecap="round"/>
          <path d="M63 67 Q68 61 73 67 M87 67 Q92 61 97 67" class="line" fill="none" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 91 Q80 102 90 91 Z" class="ink"/>
        </g>
        <g class="face face-sad">
          <path d="M62 53 L72 57 M88 57 L98 53" class="line" stroke-width="3" stroke-linecap="round"/>
          <circle cx="68" cy="67" r="3.2" class="ink"/><circle cx="92" cy="67" r="3.2" class="ink"/>
          <path d="M72 97 Q80 91 88 97" class="line" fill="none" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M112 50 q5 8 0 12 q-5 -4 0 -12 Z" class="sweat"/>
        </g>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <section class="panel" id="panel"></section>
  </main>

  <template id="tpl-title">
    <p class="tagline" data-tagline></p>
    <button class="btn primary big" data-action="start">はじめる</button>
    <p class="fine" data-count></p>
  </template>

  <template id="tpl-question">
    <h1 class="question" data-question></h1>
    <div class="answers">
      <button class="btn ans yes" data-u="1">はい</button>
      <button class="btn ans no" data-u="0">いいえ</button>
      <button class="btn ans" data-u="null">わからない</button>
      <button class="btn ans" data-u="0.75">たぶんそう</button>
      <button class="btn ans" data-u="0.25">たぶん違う</button>
    </div>
    <div class="meter" title="確信度"><div class="meter-fill" data-meter></div></div>
    <button class="btn ghost" data-action="undo">← 1つ前の質問に戻る</button>
  </template>

  <template id="tpl-guess">
    <div class="card guess-card">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <div class="guess-sub" data-sub></div>
    </div>
    <div class="answers two">
      <button class="btn ans yes" data-action="correct">はい！</button>
      <button class="btn ans no" data-action="wrong">ちがう</button>
    </div>
  </template>

  <template id="tpl-profile">
    <div class="card profile">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <dl class="facts" data-facts></dl>
      <div class="episodes-wrap">
        <h2 class="episodes-title">エピソード</h2>
        <ul class="episodes" data-episodes></ul>
        <button class="btn ghost small" data-action="more" hidden>もっと見る</button>
      </div>
    </div>
    <button class="btn primary big" data-action="restart">もう一回あそぶ</button>
  </template>

  <template id="tpl-giveup">
    <input class="search" type="search" placeholder="あだ名で検索" data-search aria-label="あだ名で検索">
    <div class="roster" data-roster></div>
    <button class="btn ghost" data-action="restart">答えずにやり直す</button>
  </template>

  <script src="config.js"></script>
  <script src="data/data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
