<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ダンイネーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="brand" id="brand"></span>
      <span class="qcount" id="qcount"></span>
    </header>

    <section class="stage">
      <svg class="maestro" id="maestro" data-mood="idle" viewBox="0 0 160 170" aria-hidden="true">
        <!-- 足（短くてぷにっとした脚） -->
        <g class="legs">
          <path d="M40 110 Q28 128 18 128" class="leg"/>
          <path d="M55 120 Q50 138 40 144" class="leg"/>
          <path d="M71 124 Q70 142 62 151" class="leg"/>
          <path d="M89 124 Q90 142 98 151" class="leg"/>
          <path d="M105 120 Q110 138 120 144" class="leg"/>
          <g class="suckers">
            <circle cx="24" cy="129" r="2.2"/><circle cx="44" cy="141" r="2.2"/>
            <circle cx="65" cy="146" r="2.2"/><circle cx="95" cy="146" r="2.2"/>
            <circle cx="116" cy="141" r="2.2"/>
          </g>
        </g>
        <!-- 指揮棒を持つ足 -->
        <g class="arm">
          <path d="M126 100 Q140 98 144 86" class="leg"/>
          <circle cx="139" cy="95" r="2.2" class="sucker"/>
          <line x1="146" y1="82" x2="158" y2="46" class="baton" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- 頭（おもち型） -->
        <path d="M24 84 C24 40 48 18 80 18 C112 18 136 40 136 84 C136 112 112 126 80 126 C48 126 24 112 24 84 Z" class="tako"/>
        <circle cx="104" cy="32" r="4.5" class="spot"/>
        <circle cx="116" cy="46" r="2.8" class="spot"/>
        <circle cx="94" cy="24" r="2.2" class="spot"/>
        <ellipse cx="48" cy="100" rx="9" ry="5.5" class="cheek"/>
        <ellipse cx="112" cy="100" rx="9" ry="5.5" class="cheek"/>
        <!-- 蝶ネクタイ -->
        <path d="M66 117 L80 124 L66 131 Z M94 117 L80 124 L94 131 Z" class="tie"/>
        <circle cx="80" cy="124" r="3.6" class="tie"/>

        <!-- 表情 -->
        <g class="face face-idle">
          <ellipse cx="62" cy="86" rx="6.5" ry="8" class="ink"/><ellipse cx="98" cy="86" rx="6.5" ry="8" class="ink"/>
          
          <path d="M73 101 Q76.5 105 80 101 Q83.5 105 87 101" class="line" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="face face-think">
          <path d="M53 72 Q60 68 66 69 M94 69 Q100 68 107 72" class="line" fill="none" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="60" cy="84" rx="6.5" ry="8" class="ink"/><ellipse cx="96" cy="84" rx="6.5" ry="8" class="ink"/>
          <circle cx="83" cy="103" r="3.6" class="line" fill="none" stroke-width="2.6"/>
        </g>
        <g class="face face-idea">
          <ellipse cx="62" cy="85" rx="8" ry="9.5" class="ink"/><ellipse cx="98" cy="85" rx="8" ry="9.5" class="ink"/>
          
          <ellipse cx="80" cy="104" rx="5" ry="5.5" class="ink"/>
          <ellipse cx="80" cy="107" rx="3" ry="1.8" class="tongue"/>
          <g class="spark"><path d="M22 30 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 Z"/><path d="M140 14 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/></g>
        </g>
        <g class="face face-proud">
          <path d="M54 89 Q62 78 70 89 M90 89 Q98 78 106 89" class="line" fill="none" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M70 98 Q80 113 90 98 Z" class="ink"/>
          <ellipse cx="80" cy="105.5" rx="4" ry="2.4" class="tongue"/>
        </g>
        <g class="face face-sad">
          <path d="M55 80 L67 86 L55 92 M105 80 L93 86 L105 92" class="line" fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M71 105 q4.5 -4 9 0 q4.5 4 9 0" class="line" fill="none" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M122 56 q6 9 0 14 q-6 -5 0 -14 Z" class="sweat"/>
        </g>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <section class="panel" id="panel"></section>
  </main>

  <template id="tpl-title">
    <p class="tagline" data-tagline></p>
    <button class="btn primary big" data-action="start">はじめる</button>
    <p class="fine" data-count></p>
  </template>

  <template id="tpl-question">
    <h1 class="question" data-question></h1>
    <div class="answers">
      <button class="btn ans yes" data-u="1">はい</button>
      <button class="btn ans no" data-u="0">いいえ</button>
      <button class="btn ans" data-u="null">わからない</button>
      <button class="btn ans" data-u="0.75">たぶんそう</button>
      <button class="btn ans" data-u="0.25">たぶん違う</button>
    </div>
    <div class="meter" title="確信度"><div class="meter-fill" data-meter></div></div>
    <button class="btn ghost" data-action="undo">← 1つ前の質問に戻る</button>
  </template>

  <template id="tpl-guess">
    <div class="card guess-card">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <div class="guess-sub" data-sub></div>
    </div>
    <div class="answers two">
      <button class="btn ans yes" data-action="correct">はい！</button>
      <button class="btn ans no" data-action="wrong">ちがう</button>
    </div>
  </template>

  <template id="tpl-profile">
    <div class="card profile">
      <div class="part-chip" data-part></div>
      <div class="guess-name" data-name></div>
      <dl class="facts" data-facts></dl>
      <div class="episodes-wrap">
        <h2 class="episodes-title">エピソード</h2>
        <ul class="episodes" data-episodes></ul>
        <button class="btn ghost small" data-action="more" hidden>もっと見る</button>
      </div>
    </div>
    <button class="btn primary big" data-action="restart">もう一回あそぶ</button>
  </template>

  <template id="tpl-giveup">
    <input class="search" type="search" placeholder="あだ名で検索" data-search aria-label="あだ名で検索">
    <div class="roster" data-roster></div>
    <button class="btn ghost" data-action="restart">答えずにやり直す</button>
  </template>

  <script src="config.js"></script>
  <script src="data/data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
